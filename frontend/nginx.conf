# Template: copied to /etc/nginx/templates/ and rendered by the nginx image at
# container start. ${BACKEND_HOST}, ${BACKEND_PORT} and ${NGINX_LOCAL_RESOLVERS}
# are filled from environment variables; other $variables are nginx's own.
#   Docker Compose: BACKEND_HOST=backend
#   Kubernetes:     BACKEND_HOST=backend.loantrack.svc.cluster.local
#                   (nginx's resolver does not use resolv.conf search domains)

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend name per request (cached 10s) instead of once at
    # startup, so a recreated backend container with a new IP is still found.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # Liveness/readiness for the frontend itself: answered by nginx, never
    # proxied, so the frontend is not restarted when the backend is down.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/loans -> http://backend:8000/loans (the /api prefix is stripped).
    location /api/ {
        set $backend_upstream http://${BACKEND_HOST}:${BACKEND_PORT};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
