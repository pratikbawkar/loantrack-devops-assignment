# EXAMPLE ONLY - dummy values. Do not put real credentials in this file.
#
# Create the real Secret without writing a password to disk, e.g.:
#   kubectl --context minikube -n loantrack create secret generic loantrack-db \
#     --from-literal=POSTGRES_USER=loantrack_user \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)"
# or copy this file to k8s/secret.yaml (git-ignored), edit it, and
#   kubectl --context minikube apply -f k8s/secret.yaml
# scripts/deploy.sh does this automatically: it uses k8s/secret.yaml if present,
# otherwise keeps an existing Secret, otherwise generates a random password.
#
# The password is only used when the database volume is first initialised;
# changing it later also needs the password changed inside PostgreSQL.
apiVersion: v1
kind: Secret
metadata:
  name: loantrack-db
  namespace: loantrack
  labels:
    app.kubernetes.io/part-of: loantrack
type: Opaque
stringData:
  POSTGRES_USER: loantrack_user
  POSTGRES_PASSWORD: change_me_dummy_password
