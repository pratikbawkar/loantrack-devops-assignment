# nginx frontend: serves the static page and proxies /api/ to the backend Service.
# Exposed with a NodePort (30080). Open it with:
#   minikube service frontend -n loantrack
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: loantrack
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: loantrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: loantrack
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: loantrack-frontend:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: loantrack-config
                  key: BACKEND_HOST
            - name: BACKEND_PORT
              valueFrom:
                configMapKeyRef:
                  name: loantrack-config
                  key: BACKEND_PORT
          # nginx answers /healthz itself, so these probes check the frontend
          # only; a backend outage does not restart or unready the frontend.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # Same reason as the backend: keep serving while the endpoint removal propagates.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Writable scratch space for a read-only root filesystem: nginx keeps
          # its pid/temp files in /tmp and renders its config into conf.d.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: loantrack
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: loantrack
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
